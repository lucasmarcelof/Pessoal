<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Recursos</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e90ff, #87cefa);
            color: #fff;
            text-align: center;
        }

        h1 {
            font-size: 1.5vw;
            margin-top: 1%;
        }

        .chart-container {
            width: auto;
            height: auto;
            display: flex;
            justify-content: left;
            align-items: left;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .chart {
            width: auto;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Percentual de uso da CPU</h1>
    <div class="chart-container">
        <div class="chart">
            {{ chart_html|safe }}
        </div>
    </div>
    <h1>Percentual de uso da memória</h1>
    <div class="chart-container">
        <div class="chart">
            {{ chart_html_memoria|safe }}
        </div>
    </div>
    <script>
        // Atualizar a página a cada 20 segundos
        setInterval(function() {
            location.reload();
        }, 20000);
    </script>
</body>
</html>
